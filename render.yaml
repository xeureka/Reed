services:
  - type: web
    name: reed-backend
    env: docker
    docker:
      dockerfile: ./apps/backend/Dockerfile
      dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-lite
    plan: free
    numInstances: 1
    healthCheckPath: /health
    autoDeploy: true
